services:
  postgres:
    image: postgres:16-alpine
    container_name: dlp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dlp_db}
      POSTGRES_USER: ${POSTGRES_USER:-dlp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dlp_user} -d ${POSTGRES_DB:-dlp_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dlp-net

  redis:
    image: redis:7-alpine
    container_name: dlp-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dlp-net

  inspection-worker:
    build:
      context: ../../inspection-worker
    container_name: inspection-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dlp_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dlp_db}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "10.10.10.20:8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - dlp-net

volumes:
  postgres_data:
  redis_data:

networks:
  dlp-net:
    driver: bridge
