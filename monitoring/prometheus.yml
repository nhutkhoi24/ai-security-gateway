global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "gateway-core"
    metrics_path: /metrics
    static_configs:
      - targets: ["10.10.10.1:8000"]

  - job_name: "inspection-worker"
    metrics_path: /metrics
    static_configs:
      - targets: ["10.10.10.20:8001"]
